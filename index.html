<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D-визуализации — галерея</title>
<style>
  :root{
    --bg: #0e1013;
    --bg-soft: #14171c;
    --card: #191d23;
    --line: rgba(255,255,255,0.09);
    --text: #e9ebef;
    --muted: #939aa6;
    --accent: #6aa9ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height:1.55;
  }
  a{color:inherit;}

  .wrap{max-width:1400px;margin:0 auto;padding:0 24px;}

  /* ---------- секции ---------- */
  section{padding:38px 0 8px;}
  section:first-of-type{padding-top:34px;}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em;}

  /* ---------- сетка карточек ---------- */
  .grid{
    display:grid;
    /* min(330px, 100%) — иначе на узком экране колонка шире вьюпорта
       и появляется горизонтальная прокрутка */
    grid-template-columns:repeat(auto-fill, minmax(min(330px, 100%), 1fr));
    gap:22px;
  }

  .card{
    position:relative;display:block;text-decoration:none;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    /* карточка чуть подрастает при наведении */
    transition: transform .28s cubic-bezier(.2,.7,.3,1),
                box-shadow .28s ease,
                border-color .28s ease;
    will-change: transform;
  }
  .card:hover{
    transform: translateY(-4px) scale(1.022);
    border-color: rgba(106,169,255,.5);
    box-shadow: 0 18px 42px rgba(0,0,0,.55);
    z-index:2;
  }
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .shot{
    position:relative;display:block;width:100%;aspect-ratio:16/9;
    background:#0b0d10;overflow:hidden;
  }
  .shot img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition: transform .5s cubic-bezier(.2,.7,.3,1), filter .28s ease;
  }
  .card:hover .shot img{transform:scale(1.07);filter:saturate(1.06);}

  /* кнопка «открыть», проявляется при наведении */
  .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(to top, rgba(8,10,13,.72), rgba(8,10,13,0) 55%);
    opacity:0;transition:opacity .28s ease;
  }
  .card:hover .play{opacity:1;}
  .play span{
    background:rgba(16,19,24,.86);
    border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;
    transform:translateY(6px);transition:transform .28s ease;
  }
  .card:hover .play span{transform:translateY(0);}

  .meta{padding:14px 16px 16px;}
  .title{font-size:15px;font-weight:600;margin:0 0 3px;}
  .info{margin:0;color:var(--muted);font-size:12.5px;}

  .badge{
    position:absolute;top:12px;left:12px;z-index:1;
    background:rgba(10,12,16,.72);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:4px 11px;font-size:11.5px;letter-spacing:.02em;
  }

  /* ---------- просмотр скриншота ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;
    background:rgba(6,8,11,.94);backdrop-filter:blur(6px);
    padding:28px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;}
  .lb-close{
    position:absolute;top:18px;right:22px;z-index:2;
    background:none;border:none;color:var(--text);font-size:34px;line-height:1;
    cursor:pointer;opacity:.7;
  }
  .lb-close:hover{opacity:1;}
  .lb-cap{
    position:absolute;bottom:20px;left:0;right:0;text-align:center;
    color:var(--muted);font-size:13px;pointer-events:none;
  }

  /* стрелки перелистывания по бокам фото */
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(22,26,32,.72);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px);
    color:var(--text);font-size:26px;line-height:1;
    cursor:pointer;opacity:.75;
    transition:opacity .2s ease, transform .2s ease, background .2s ease;
  }
  .lb-nav:hover{opacity:1;background:rgba(32,38,46,.9);}
  .lb-prev{left:22px;}
  .lb-next{right:22px;}
  .lb-prev:hover{transform:translateY(-50%) translateX(-3px);}
  .lb-next:hover{transform:translateY(-50%) translateX(3px);}
  @media (max-width:620px){
    .lb-nav{width:46px;height:46px;font-size:22px;}
    .lb-prev{left:8px;} .lb-next{right:8px;}
  }

  footer{
    margin-top:64px;padding:26px 0 40px;
    border-top:1px solid var(--line);color:var(--muted);font-size:13px;
  }
  footer code{
    background:var(--bg-soft);border:1px solid var(--line);
    padding:2px 6px;border-radius:5px;font-size:12px;
  }

  .empty{
    border:1px dashed var(--line);border-radius:12px;
    padding:28px;color:var(--muted);font-size:14px;
  }


  @media (prefers-reduced-motion: reduce){
    .card, .shot img, .play, .play span{transition:none;}
    .card:hover{transform:none;}
    .card:hover .shot img{transform:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <section id="models-section">
    <div class="sec-head"><h2>Модели</h2></div>
    <div class="grid" id="models"></div>
  </section>

  <section id="shots-section">
    <div class="sec-head"><h2>Рендеры</h2></div>
    <div class="grid" id="shots"></div>
  </section>

</div>

<footer>
  <div class="wrap">
    Чтобы добавить работу — положите <code>Имя.fbx</code> и одноимённый скриншот
    в папку <code>f</code> и запустите <code>build-site.ps1</code>: он пересоберёт
    превью и список.
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Закрыть">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Предыдущее">‹</button>
  <img id="lbImg" alt="" />
  <button class="lb-nav lb-next" id="lbNext" aria-label="Следующее">›</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<!-- Манифест генерируется build-site.ps1. Подключён как <script>, а не через
     fetch, чтобы страница работала и по http, и открытая с диска. -->
<script src="site-data.js"></script>
<script>
(function () {
  const data = window.SITE_DATA || { models: [], shots: [] };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- модели ----------
  const modelsEl = document.getElementById('models');
  if (!data.models.length) {
    modelsEl.outerHTML = '<div class="empty">Моделей пока нет. Положите .fbx в папку f ' +
                         'и запустите build-site.ps1.</div>';
  } else {
    modelsEl.innerHTML = data.models.map((m) => {
      const href = 'viewer.html?model=' + encodeURIComponent(m.file) +
                   '&name=' + encodeURIComponent(m.name);
      const thumb = m.thumb
        ? '<img src="' + esc(m.thumb) + '" alt="' + esc(m.name) + '" loading="lazy" />'
        : '';
      return '' +
        '<a class="card" href="' + href + '">' +
          '<span class="badge">3D</span>' +
          '<span class="shot">' + thumb +
            '<span class="play"><span>Открыть в 3D →</span></span>' +
          '</span>' +
          '<div class="meta">' +
            '<p class="title">' + esc(m.name) + '</p>' +
            '<p class="info">FBX · ' + esc(m.sizeMB) + ' МБ</p>' +
          '</div>' +
        '</a>';
    }).join('');
  }

  // ---------- отдельные рендеры ----------
  // Только картинка: имя файла и разрешение ничего не говорят зрителю, а
  // подсказка про полный экран и так появляется при наведении.
  const shotsEl = document.getElementById('shots');
  if (!data.shots.length) {
    document.getElementById('shots-section').style.display = 'none';
  } else {
    shotsEl.innerHTML = data.shots.map((s, i) =>
      '<a class="card" href="' + esc(s.large) + '" data-i="' + i + '">' +
        '<span class="shot">' +
          '<img src="' + esc(s.thumb) + '" alt="" loading="lazy" />' +
          '<span class="play"><span>Открыть ⤢</span></span>' +
        '</span>' +
      '</a>').join('');
  }

  // ---------- просмотр во весь экран с перелистыванием ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCap = document.getElementById('lbCap');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');
  let current = 0;

  function show(i) {
    const n = data.shots.length;
    current = (i + n) % n;                 // по кругу: с последнего на первый
    const s = data.shots[current];
    lbImg.src = s.large;
    lbCap.textContent = (current + 1) + ' / ' + n;
    // при одном изображении листать нечего
    const many = n > 1;
    lbPrev.style.display = many ? '' : 'none';
    lbNext.style.display = many ? '' : 'none';
    // подгружаем соседние заранее, чтобы листалось без задержки
    [current - 1, current + 1].forEach((k) => {
      const nb = data.shots[(k + n) % n];
      if (nb) new Image().src = nb.large;
    });
  }

  function open(i) { show(i); lb.classList.add('open'); }
  function close() { lb.classList.remove('open'); lbImg.src = ''; }

  shotsEl && shotsEl.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    open(+card.dataset.i);
  });

  // stopPropagation — иначе клик по стрелке дойдёт до фона и закроет просмотр
  lbPrev.addEventListener('click', (e) => { e.stopPropagation(); show(current - 1); });
  lbNext.addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });
  document.getElementById('lbClose').addEventListener('click', close);
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });

  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
  });

  // свайп на телефоне
  let touchX = null;
  lb.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });
})();
</script>
</body>
</html>
