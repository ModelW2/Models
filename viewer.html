});

const fAO = gui.addFolder('Ambient Occlusion');
fAO.add(params.ao, 'radius', 2, 80, 1).name('Радиус (px)').onChange((v) => (aoPass.uniforms.aoRadius.value = v));
fAO.add(params.ao, 'strength', 0, 2, 0.01).name('Сила').onChange((v) => (aoPass.uniforms.aoStrength.value = v));

const fMat = gui.addFolder('Материал (override)');
fMat.add(params.material, 'invertRoughness').name('Инверт. roughness (glossiness→roughness)');
fMat.add(params.material, 'overrideEnabled').name('Включить override').onChange(applyMaterialOverride);
fMat.add(params.material, 'roughness', 0, 1, 0.01).name('Roughness').onChange(applyMaterialOverride);
fMat.add(params.material, 'metalness', 0, 1, 0.01).name('Metalness').onChange(applyMaterialOverride);

function applyMaterialOverride() {
  if (!params.material.overrideEnabled || !currentModel) return;
  currentModel.traverse((c) => {
    if (c.isMesh) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach((m) => {
        if (m.isMeshStandardMaterial) {
          m.roughness = params.material.roughness;
          m.metalness = params.material.metalness;
        }
      });
    }
  });
}

const fQuality = gui.addFolder('Качество и производительность');
fQuality.add(params, 'quality', {
  'Авто (понижать при тормозах)': 'auto',
  'Низкое': 'low', 'Среднее': 'medium', 'Высокое': 'high',
}).name('Уровень').onChange((v) => {
  if (v === 'auto') { autoTuneBudget = 2; slowTime = 0; return; }
  autoTuneBudget = 0;              // ручной выбор — авто больше не вмешивается
  applyQuality(v);
});
fQuality.add({ info: () => alert(
  'Уровень меняет сразу несколько вещей:\n\n' +
  '• разрешение рендера (на ретине это главный расход)\n' +
  '• сглаживание в постобработке\n' +
  '• размер карты теней и число выборок PCSS\n' +
  '• ambient occlusion\n\n' +
  'Если тормозит даже на «Низком» — модель слишком тяжёлая для этой видеокарты.'
) }, 'info').name('Что это меняет?');

const fScene = gui.addFolder('Сцена');
fScene.add(params, 'ground').name('Показывать пол').onChange((v) => (ground.visible = v));
fScene.add(params, 'fog').name('Туман (перспектива)').onChange(() => applySceneScale(currentModel ? new THREE.Box3().setFromObject(currentModel) : null));
fScene.add(params, 'autoRotate').name('Авто-вращение').onChange((v) => (controls.autoRotate = v));
fScene.add({ reset: () => frameObject(currentModel || demoGroup) }, 'reset').name('Сбросить камеру');

// Панель по умолчанию свёрнута: разделов уже десяток, и развёрнутыми они
// занимают весь экран. Сворачиваем и сами разделы — тогда при раскрытии
// панели видно аккуратный список заголовков, а не простыню ползунков.
gui.foldersRecursive().forEach((folder) => folder.close());
gui.close();

// ---------- Render loop ----------
const clock = new THREE.Clock();
let fpsAcc = 0, fpsCount = 0, fpsTimer = 0;

// Один полный кадр: сначала вспомогательный буфер нормалей+глубины
// (нужен проходу AO и объёмному свету), затем картинка через composer.
function renderFrame() {
  // здесь, а не в цикле анимации: тогда правильное отсечение получают и
  // обычные кадры, и снимки в произвольном разрешении
  updateCameraClip();

  // Проход нормалей+глубины рисует всю сцену второй раз. Нужен он только
  // проходам AO и объёмного света — если оба выключены, пропускаем.
  if (aoPass.enabled || volumetricPass.enabled) {
    const prevOverride = scene.overrideMaterial;
    scene.overrideMaterial = normalMaterial;
    const prevTarget = renderer.getRenderTarget();
    renderer.setRenderTarget(normalTarget);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(prevTarget);
    scene.overrideMaterial = prevOverride;
  }

  composer.render();
}

// Рендер кадра в произвольном разрешении (скриншот). Пиксель-ратио на время
// снимка = 1, чтобы размер картинки был ровно тем, что запросили.
function snapshot(w = 1920, h = 1080) {
  const prevPr = renderer.getPixelRatio();
  const prevAspect = camera.aspect;
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  buildNormalTarget(w, h);
  aoPass.uniforms.resolution.value.set(w, h);

  renderFrame();
  // toDataURL строго в том же кадре — иначе drawing buffer уже очищен
  const url = renderer.domElement.toDataURL('image/png');

  renderer.setPixelRatio(prevPr);
  camera.aspect = prevAspect;
  resize();
  return url;
}

function downloadSnapshot() {
  const url = snapshot(1920, 1080);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fbx-viewer-' + Date.now() + '.png';
  a.click();
}
document.getElementById('btnShot').onclick = downloadSnapshot;

/* Автоподбор качества. Понижаем уровень, если частота кадров держится
   низкой — и только понижаем: авто-повышение приводило бы к качелям, когда
   на границе уровень скачет туда-сюда каждые пару секунд. Поднять можно
   вручную из панели. */
let slowTime = 0;
let autoTuneBudget = 2;      // не больше двух понижений за сеанс
function autoTuneQuality(dt, fps) {
  if (params.quality !== 'auto' || autoTuneBudget <= 0) return;
  // первые полсекунды не считаем: там компиляция шейдеров и загрузка текстур
  if (clock.elapsedTime < 1.5) return;

  slowTime = fps < 24 ? slowTime + dt : 0;
  if (slowTime < 1.5) return;

  const i = QUALITY_ORDER.indexOf(activePresetName);
  if (i > 0) {
    autoTuneBudget--;
    slowTime = 0;
    applyQuality(QUALITY_ORDER[i - 1]);
    console.log('Качество понижено до «' + activePreset.label + '»: ' +
                Math.round(fps) + ' FPS');
  } else {
    autoTuneBudget = 0;       // ниже некуда
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  controls.update();
  if (mixer) {
    mixer.update(dt);
    // при анимации геометрия движется — карту теней приходится обновлять каждый кадр
    renderer.shadowMap.needsUpdate = true;
  }

  renderFrame();

  // fps
  fpsAcc += dt; fpsCount++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    const fps = fpsCount / fpsAcc;
    document.getElementById('statFps').textContent =
      'FPS: ' + Math.round(fps) + '  ·  ' + activePreset.label;
    autoTuneQuality(fpsTimer, fps);
    fpsAcc = 0; fpsCount = 0; fpsTimer = 0;
  }
}
animate();

// Небольшой отладочный хук в консоль браузера (необязательно для работы вьюера)
window.viewer = {
  scene, camera, renderer, controls, params, updateSun, frameObject, aoPass, sunLight, sky, THREE,
  composer, snapshot, renderFrame, loadFbxFromUrl, volumetricPass,
  loadHDRIFromFile, applySunFromHDRI, updateEnvironment, applyQuality,
  getQuality: () => activePresetName,
  getHdriInfo: () => ({
    name: hdriName,
    size: hdriTexture ? [hdriTexture.image.width, hdriTexture.image.height] : null,
  }),
  extractEmbeddedFbxData, buildEmbeddedMaterialTextureMap, loadFbxFromArrayBuffer, currentModelGetter: () => currentModel,
};
</script>
</body>
</html>
